name: CI/CD Build and Update

on:
  push:
    branches: [ "main" ]

jobs:
  # JOB 1: Budowanie i wysyłanie obrazów
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:${{ github.run_id }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:${{ github.run_id }}
          
  # JOB 2: Aktualizacja Helm Charts
  update-helm:
    name: Update Helm Charts
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Update Helm Values
        run: |
          FILE_PATH="helm/todo-app-chart/values.yaml"
          sed -i "/backend:/,/imageTag:/ s/imageTag: .*/imageTag: \"${{ github.run_id }}\"/" $FILE_PATH
          sed -i "/frontend:/,/imageTag:/ s/imageTag: .*/imageTag: \"${{ github.run_id }}\"/" $FILE_PATH

      - name: Commit and push changes
        run: |
          git config --global user.name "Karol"
          git config --global user.email "karolarabasz6@gmail.com"
          git add helm/todo-app-chart/values.yaml
          git commit -m "chore: update image tags to ${{ github.run_id }} [skip ci]"
          git push