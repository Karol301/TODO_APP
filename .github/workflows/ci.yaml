name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  push_to_registry:
    name: Push Docker images to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Budowanie Backend
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:${{ github.run_id }}

      # Budowanie Frontend
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:${{ github.run_id }}

      # Aktualizacja wartości w Helm
      - name: Update Helm Values
        run: |
          FILE_PATH="helm/todo-app-chart/values.yaml"
          sed -i "/backend:/,/imageTag:/ s/imageTag: .*/imageTag: \"${{ github.run_id }}\"/" $FILE_PATH
          
          sed -i "/frontend:/,/imageTag:/ s/imageTag: .*/imageTag: \"${{ github.run_id }}\"/" $FILE_PATH

      - name: Commit and push changes
        run: |
          git config --global user.name "Karol"
          git config --global user.email "karolarabasz6@gmail.com"
          git add helm/todo-app-chart/values.yaml
          git commit -m "chore: update image tags to ${{ github.run_id }} [skip ci]"
          git push